name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The suite is fully offline: no credentials or network access required.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Lint
        run: ruff check .

      - name: Smoke test the CLI
        run: |
          nrp-usage --version
          nrp-usage --help >/dev/null
          nrp-usage --explain --gateway >/dev/null
          nrp-usage --json </dev/null >/dev/null 2>&1 || true   # network may be unavailable
